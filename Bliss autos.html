<!DOCTYPE html>
<html lang="en">
    <head>        
        <meta charset="utf-8">
        <title>Bliss Autos</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="Blisss autos.css">
        
    </head>
    <body>
        <h1>Bliss Autos</h1>
        <h2>Car dealership</h2> 
        <header>
            <nav>
                <ul>
                    <li><a href="Dashboard.html">Dashboard</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="Register.html">Register</a></li>
                    <li><a href="login.html">Login</a></li>
                </ul>
            </nav>
        </header>
        <section id="home">
                <h2>Welcome to Bliss Autos</h2>
                <h3>Quality is Credited</h3>
                <button onclick="window.location.href='Inventory.html'">Browse Inventory</button>
        </section>
        <section id="contact">
            <h2>Contact Us</h2>
            <form id="contact-form">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <label for="message">Message:</label>
                <textarea id="message" name="message" required></textarea>
                <button type="submit">Submit</button>
            </form>
        </section>

        <section id="feedback">
            <h2>Provide Your Feedback</h2>
            <a href="https://ee.kobotoolbox.org/x/wUv9T2rv" target="_blank">Click here to take the survey</a>
        </section>

        <!-- Premium Chatbot Floating Widget -->
        <div id="chatbot-widget">
            <button id="chatbot-button" title="Chat with AI Assistant">💬</button>
            <div id="chatbot-window">
                <div class="chatbot-header">
                    <h3>Bliss Autos Assistant</h3>
                    <button id="chatbot-close" class="chatbot-close">&times;</button>
                </div>
                <div class="chatbot-body" id="chat-messages">
                    <!-- Chat messages will appear here -->
                </div>
                <!-- Leads intake form for new customers -->
                <div id="chat-leads-form">
                    <h4>Introduce Yourself</h4>
                    <input type="text" id="lead-name" placeholder="Your Name" required>
                    <input type="email" id="lead-email" placeholder="Your Email" required>
                    <button id="submit-lead">Start Chat</button>
                </div>
                <div class="chatbot-footer">
                    <input type="text" id="chat-input" placeholder="Type a message..." disabled>
                    <button id="send-chat" disabled>➔</button>
                </div>
            </div>
        </div>

        <footer>
            <p>&copy; 2024 Bliss Autos. All rights reserved.</p>
        </footer>
        <script src="Bliss.js"></script> 
    </body>
</html>
